<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Moment Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Pacifico&family=Patrick+Hand&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',sans-serif;color:#31406b;background:linear-gradient(160deg,#dff1ff,#fff0f6 50%,#fff8d9);min-height:100vh;padding:20px 14px 50px}
h1{font-family:'Playfair Display',serif;font-weight:900;text-align:center;margin:0;font-size:clamp(26px,6vw,42px);color:#5b1f32;letter-spacing:1px}
.brand-head{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px auto 22px}
.brand-head img{
  width:clamp(48px,8vw,76px);
  height:clamp(48px,8vw,76px);
  object-fit:contain;
  filter:brightness(0) saturate(100%) invert(13%) sepia(25%) saturate(1200%) hue-rotate(176deg) brightness(90%) contrast(95%);
}
.booth-slogan{text-align:center;max-width:520px;margin:12px auto 0;padding:10px 16px;border-radius:30px;background:#5b1f32;color:#fff4d6;font-size:clamp(11px,2.5vw,14px);letter-spacing:2px;font-weight:600;line-height:1.6}

h2{text-align:center;font-size:18px;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:18px;padding:8px;border:4px solid transparent;cursor:pointer;box-shadow:0 6px 18px #6a8fd422;transition:.2s;text-align:center;font-weight:800;font-size:13px}
.card:hover{transform:translateY(-4px)}.card.on{border-color:#ff6f9c}
.card canvas{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:6px}
#booth{display:none;max-width:900px;margin:auto;gap:20px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.cam{position:relative;width:min(100%,520px)}
video{width:100%;aspect-ratio:4/3;object-fit:cover;background:#222;border-radius:20px;border:5px solid #fff;box-shadow:0 8px 24px #6a8fd433;display:block}
#cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 120px 'Playfair Display';color:#fff;text-shadow:0 4px 20px #0008;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;border-radius:20px;pointer-events:none;transition:opacity .4s}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
button,select{font:700 14px 'Be Vietnam Pro';border:0;border-radius:30px;padding:11px 18px;background:#fff;color:#31406b;cursor:pointer;box-shadow:0 3px 10px #6a8fd433}
button.main{background:#ff6f9c;color:#fff;font-size:16px}button:disabled{opacity:.4;cursor:default}
#out{width:190px;max-width:45vw;height:auto;border-radius:8px;box-shadow:0 8px 24px #6a8fd455}
#st{text-align:center;font-weight:700;margin-top:10px}
/* ===== Giao diện điện thoại ===== */
html{-webkit-text-size-adjust:100%}
button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

@media (max-width:700px){
  body{padding:14px 10px calc(30px + env(safe-area-inset-bottom))}.brand-head{gap:9px;margin-bottom:16px}.brand-head img{width:54px;height:58px}
  h2{font-size:16px;margin:16px 0 10px}
  .sub{font-size:12px;letter-spacing:1px;margin-bottom:12px}

  /* chọn khung: 2 cột */
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{border-radius:14px;padding:6px;font-size:12px}

  /* khu vực chụp: xếp dọc, camera to full màn hình */
  #booth{flex-direction:column;align-items:center;gap:16px}
  .cam{width:100%}
  video{border-width:3px;border-radius:16px}
  #cd{font-size:90px}
  #flash{border-radius:16px}

  /* nút bấm to, dễ chạm */
  .btns{gap:8px}
  .btns button,.btns select{padding:12px 14px;font-size:14px;min-height:44px}
  .btns button.main{flex:1 1 100%;font-size:17px;padding:14px}

  /* ảnh xem trước + nút tải */
  #out{width:62vw;max-width:260px}
  #st{font-size:14px;padding:0 6px}
}

/* màn hình rất nhỏ */
@media (max-width:360px){
  .btns button,.btns select{flex:1 1 45%;padding:11px 8px;font-size:13px}
  #cd{font-size:72px}
}

/* điện thoại nằm ngang */
@media (max-height:480px) and (orientation:landscape){
  #booth{flex-direction:row;align-items:flex-start}
  .cam{width:55%}
  #out{width:120px}
  #cd{font-size:64px}
}
</style>
</head>

/* ---------- chi tiết minh họa riêng cho từng bộ khung ---------- */
function frameExtras(c,f){
  c.save();
  if(f===2){
    // Sinh nhật: viền caro phấn nhạt hai bên + trái tim nhỏ
    c.save();c.globalAlpha=.18;for(let y=0;y<H;y+=42){for(let x of [32,548]){c.fillStyle=((Math.floor(y/42)+Math.floor(x/24))%2)?'#d8a7a2':'#fff';c.fillRect(x,y,20,21)}}c.restore();
    T(c,'SWEET MEMORIES',300,292,'italic 700 18px "Playfair Display"','#a86b45');
    T(c,'♡',40,730,'30px serif','#e0708f');T(c,'♡',560,1140,'30px serif','#e0708f');
  }else if(f===3){
    // 20/11: hoa ép khô ở bốn góc cạnh khung
    const flower=(x,y,r)=>{c.save();c.translate(x,y);c.strokeStyle='#8ba17b';c.lineWidth=2;c.beginPath();c.moveTo(0,0);c.lineTo(0,r*2.4);c.stroke();for(let a=0;a<6;a++){let q=a*Math.PI/3;c.fillStyle=a%2?'#e9a9b5':'#f3c9ce';c.beginPath();c.ellipse(Math.cos(q)*r*.65,Math.sin(q)*r*.65,r*.38,r*.7,q,0,Math.PI*2);c.fill()}c.fillStyle='#c99b54';c.beginPath();c.arc(0,0,r*.25,0,Math.PI*2);c.fill();c.restore()};
    flower(46,320,10);flower(554,320,10);flower(46,1560,10);flower(554,1560,10);
  }
  c.restore();
}

/* ---------- vẽ ---------- */
function render(f,photos,cv){
  cv.width=W*K;cv.height=H*K;const c=cv.getContext('2d');c.setTransform(K,0,0,K,0,0);
  const F=FR[f];F.bg(c);
  WY.forEach((y,i)=>{c.save();F.path(c,y);c.clip();
    if(photos&&photos[i])c.drawImage(photos[i],WX-12,y-12,WW+24,WH+24);else{c.fillStyle='#2a2a33';c.fillRect(WX,y,WW,WH);T(c,'📷',WX+WW/2,y+WH/2,'60px serif','#000')}
    c.restore();F.border(c,i,y)});
  F.top(c);F.bottom(c);frameExtras(c,f);LS(c,1);T(c,'CHỤP MỘT KHOẢNH KHẮC, GIỮ MỘT KỶ NIỆM',300,1757,'600 14px "Be Vietnam Pro"',F.ink);LS(c,0)}
/* ---------- giao diện ---------- */
const grid=$('#grid'),out=$('#out');
function init(){FR.forEach((f,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML='<canvas></canvas>'+(i+1)+'. '+f.name;render(i,null,d.firstChild);d.onclick=()=>pick(i,d);grid.append(d)})}
let facing='user',switching=false,mirror=true;
const applyMirror=()=>$('#v').style.transform=(facing==='user'&&mirror)?'scaleX(-1)':'none';
async function startCam(){
  if(switching)return;switching=true;$('#flip').disabled=true;
  const v=$('#v');
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null}
  const base={width:{ideal:1280},height:{ideal:960}};
  for(const vid of [{...base,facingMode:{exact:facing}},{...base,facingMode:facing},true]){
    try{stream=await navigator.mediaDevices.getUserMedia({video:vid,audio:false});break}catch(e){}
  }
  if(stream){v.srcObject=stream;applyMirror();try{await v.play()}catch(e){}status()}
  else $('#st').textContent='⚠️ Không mở được camera. Hãy cho phép quyền camera và mở trang qua https hoặc localhost.';
  switching=false;$('#flip').disabled=false}
$('#flip').onclick=()=>{if(busy||switching)return;facing=facing==='user'?'environment':'user';startCam()};
async function pick(i,el){
  cur=i;document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  $('#booth').style.display='flex';$('#h2b').style.display='block';reset();
  if(!stream)await startCam();
  $('#booth').scrollIntoView({behavior:'smooth'})}
function reset(){shots=[];busy=false;draw();status()}
function draw(){render(cur,shots,out);$('#dl').disabled=shots.length<3;$('#snap').disabled=shots.length>=3||busy;$('#undo').disabled=!shots.length||busy}
function status(){$('#st').textContent=shots.length<3?'Sẵn sàng chụp '+cap[shots.length]+' / 3':'🎉 Xong rồi! Bấm "Tải ảnh về" nhé.'}
async function snap(){
  const v=$('#v');if(!v.videoWidth)return;busy=true;draw();
  for(let n=+$('#tm').value;n>0;n--){$('#cd').textContent=n;await new Promise(r=>setTimeout(r,1000))}
  $('#cd').textContent='';
  const s=document.createElement('canvas');s.width=(WW+24)*K;s.height=(WH+24)*K;const c=s.getContext('2d');
  const vw=v.videoWidth,vh=v.videoHeight,ar=s.width/s.height;let sw=vw,sh=vw/ar;if(sh>vh){sh=vh;sw=vh*ar}
  if(facing==='user'&&mirror){c.translate(s.width,0);c.scale(-1,1)}
  c.drawImage(v,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,s.width,s.height);
  shots.push(s);const fl=$('#flash');fl.style.opacity=1;setTimeout(()=>fl.style.opacity=0,120);
  busy=false;draw();status()}
$('#snap').onclick=snap;
$('#undo').onclick=()=>{shots.pop();draw();status()};
$('#reset').onclick=reset;
$('#dl').onclick=()=>out.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='happy-moment-'+FR[cur].name+'.png';a.click()},'image/png');
document.fonts.ready.then(()=>Promise.all(['900 20px "Playfair Display"','700 20px "Playfair Display"','20px "Patrick Hand"','700 14px "Be Vietnam Pro"'].map(f=>document.fonts.load(f,'Việt ÂĂỒ')))).then(init,init);
