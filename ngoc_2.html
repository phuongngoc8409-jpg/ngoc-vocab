<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngoc Vocab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{font-family:'Quicksand',sans-serif;background:radial-gradient(circle at top left,#eefbf4 0,#f7fbff 36%,#fff 100%);min-height:100vh}.glass-card{background:rgba(255,255,255,0.9);border:1px solid #e0f2e9;border-radius:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05)}.soft-btn{border-radius:999px;transition:transform .2s,filter .2s;font-weight:700}.soft-btn:hover{transform:scale(1.02)}.tab-btn.active{background:#4a9eff;color:#fff}.mode-btn.active{background:#dbeafe;color:#1d4ed8;border-color:#93c5fd}.flash-scene{perspective:1200px;min-height:310px}.flash-card{position:relative;min-height:310px;width:100%;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}.flash-card.is-flipped{transform:rotateY(180deg)}.flash-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.4rem;border-radius:24px;background:#fff;border:2px solid #e0f2e9}.flash-back{transform:rotateY(180deg)}.answer-card{border:2px solid transparent}.answer-card.correct{border-color:#22c55e;background:#dcfce7}.answer-card.wrong{border-color:#ef4444;background:#fee2e2}.match-card{min-height:84px;border:2px solid #e5e7eb;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:.6rem;font-weight:700}.match-card.selected{border-color:#4a9eff;background:#eff6ff}.match-card.matched{opacity:0;pointer-events:none}.shake{animation:shake .28s ease-in-out}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.progress-red{transition:width .1s linear}input,textarea,select{border-radius:18px!important;border:1px solid #d1d5db;outline:none}input:focus,textarea:focus,select:focus{border-color:#4a9eff;box-shadow:0 0 0 3px rgba(74,158,255,0.14)}.badge{border-radius:999px;padding:.25rem .65rem;font-size:.78rem;font-weight:700}.main-grid{display:grid;grid-template-columns:1fr 320px;gap:1.5rem}@media(max-width:768px){.main-grid{grid-template-columns:1fr}}.speak-icon-btn{width:48px;height:48px;border-radius:24px;background:#fff;border:2px solid #e5e7eb;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}.speak-icon-btn:hover{border-color:#4a9eff;background:#eff6ff}.sound-bars{display:flex;align-items:center;gap:3px}.sound-bar{width:4px;background:#6b7280;border-radius:2px}.bar-1{height:12px}.bar-2{height:18px}.bar-3{height:24px}.speak-icon-btn:hover .sound-bar{background:#4a9eff}.stat-card{padding:6px 12px;border-radius:20px;background:#f8fafc;font-size:12px;font-weight:700;text-align:center}.select-sm{padding:8px 12px;border-radius:40px;font-size:13px;font-weight:600}.srs-btn{padding:10px 0;font-size:13px}.example-item{padding:10px 10px;background:#f8fafc;border-radius:16px;margin-bottom:8px;display:flex;align-items: center;gap:8px;justify-content:center}.example-bullet{color:#4a9eff;font-weight:1200;margin-top:2px;align-items:center;justify-content:center}
  </style>
</head>
<body>
<div class="max-w-6xl mx-auto px-4 py-4 md:py-6">
  <!-- HEADER - 3 nút ngang hàng -->
  <header class="glass-card p-3 md:p-4 mb-4">
    <div class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
      <div class="flex-1"><h1 class="text-2xl md:text-3xl font-bold text-gray-800">Ngoc <span class="text-[#4a9eff]">Vocab</span></h1><p class="text-xs text-gray-500 hidden md:block"></p></div>
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="stat-card flex items-center gap-1">🔥 <span id="streakCount">0</span> ngày</div>
        <div class="stat-card flex items-center gap-1"><i data-lucide="timer" class="w-3 h-3"></i> <span id="pomodoroTime">25:00</span>
          <button id="pomodoroPlay" class="ml-1 text-green-600"><i data-lucide="play" class="w-3 h-3"></i></button>
          <button id="pomodoroPause" class="text-orange-500"><i data-lucide="pause" class="w-3 h-3"></i></button>
          <button id="pomodoroReset" class="text-gray-500"><i data-lucide="rotate-ccw" class="w-3 h-3"></i></button>
        </div>
        <div class="stat-card">🎯 <span id="dailyDone">0</span>/<span id="dailyGoal">20</span></div>
      </div>
    </div>
    <div class="mt-2 h-2 bg-gray-100 rounded-full overflow-hidden"><div id="dailyProgressBar" class="h-full bg-gradient-to-r from-emerald-300 to-blue-400 rounded-full" style="width:0%"></div></div>
  </header>

  <nav class="glass-card p-1.5 mb-4 flex gap-2">
    <button id="studyTabBtn" class="tab-btn active soft-btn flex-1 px-3 py-2 text-sm flex items-center justify-center gap-1"><span>📚</span> Học tập</button>
    <button id="libraryTabBtn" class="tab-btn soft-btn flex-1 px-3 py-2 text-sm flex items-center justify-center gap-1"><span>📖</span> Thư viện</button>
  </nav>

  <main>
    <section id="studyTab" class="space-y-4">
      <!-- 2 nút chọn ngang nhau -->
      <div class="glass-card p-3">
        <div class="flex justify-center items-center gap-3">
          <select id="studyTopicSelect" class="select-sm flex-1 bg-white border"></select>
          <select id="modeSelect" class="select-sm flex-1 bg-white border">
            <option value="flashcard">🃏 Flashcard</option>
            <option value="match">🧩 Ghép thẻ</option>
            <option value="mcq">✅ Trắc nghiệm</option>
            <option value="writing">✍️ Tự viết</option>
            <option value="speed">⚡ Phản xạ nhanh</option>
            <option value="listenSentence">🎧 Nghe chép câu</option>
            <option value="fillBlank">🕳️ Điền khuyết</option>
            <option value="listenWord">🔊 Nghe chép từ</option>
          </select>
        </div>
        <div id="dueInfo" class="text-right text-[13px] text-gray-500 mt-2">📅 Thẻ đến hạn: <span id="dueCount">0</span></div>
      </div>

      <div class="main-grid">
        <div id="practiceArea" class="glass-card p-4 min-h-[480px]"></div>
        <div class="space-y-3">
          <!-- Nút phát âm TRÊN bảng điều khiển -->
          <div class="glass-card p-3 flex justify-center">
            <div id="speakCurrentBtn" class="speak-icon-btn"><div class="sound-bars"><div class="sound-bar bar-1"></div><div class="sound-bar bar-2"></div><div class="sound-bar bar-3"></div></div></div>
          </div>
          <!-- Bảng điều khiển -->
          <div class="glass-card p-3">
            <h2 class="text-sm font-bold mb-2">📊 Bảng điều khiển</h2>
            <div id="feedbackBox" class="rounded-xl bg-gray-50 border p-2 min-h-[60px] text-xs font-bold text-gray-600">Chọn chế độ học</div>
            <div class="mt-3 grid grid-cols-2 gap-2 text-center">
              <div class="rounded-xl bg-emerald-50 p-2"><p class="text-[10px] text-gray-500">Đúng liên tiếp</p><p id="sessionStreak" class="text-xl font-bold text-emerald-600">0</p></div>
              <div class="rounded-xl bg-blue-50 p-2"><p class="text-[10px] text-gray-500">Đã học</p><p id="sessionDone" class="text-xl font-bold text-blue-600">0</p></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="libraryTab" class="hidden space-y-4">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div class="glass-card p-4"><h2 class="text-xl font-bold mb-3">📁 Quản lý bài học</h2><div class="flex gap-2 mb-3"><input id="newTopicInput" class="flex-1 px-3 py-2 text-sm" placeholder="Tên bài học mới..." /><button id="addTopicBtn" class="soft-btn bg-[#4a9eff] text-white px-4 py-2 text-sm">Tạo</button></div><div id="topicGrid" class="grid grid-cols-1 gap-2 max-h-64 overflow-y-auto"></div></div>
        <div class="glass-card p-4"><div class="flex justify-between mb-3"><h2 class="text-xl font-bold">✏️ Thêm/sửa từ</h2><select id="formTopicSelect" class="px-3 py-1 text-sm"></select></div><form id="wordForm" class="grid grid-cols-2 gap-2"><input type="hidden" id="editingWordId" /><input id="enInput" class="px-3 py-2 text-sm" placeholder="English *" required /><input id="viInput" class="px-3 py-2 text-sm" placeholder="Nghĩa *" required /><input id="loaiInput" class="px-3 py-2 text-sm" placeholder="Loại từ" /><input id="amInput" class="px-3 py-2 text-sm" placeholder="Phiên âm" /><input id="ex1Input" class="col-span-2 px-3 py-2 text-sm" placeholder="Ví dụ 1" /><input id="ex2Input" class="col-span-2 px-3 py-2 text-sm" placeholder="Ví dụ 2" /><input id="synInput" class="px-3 py-2 text-sm" placeholder="Đồng nghĩa" /><input id="antInput" class="px-3 py-2 text-sm" placeholder="Trái nghĩa" /><input id="cefrInput" class="px-3 py-2 text-sm" placeholder="CEFR" /><div class="col-span-2 flex gap-2"><button class="soft-btn flex-1 bg-emerald-500 text-white py-2 text-sm" type="submit">Lưu</button><button id="cancelEditBtn" class="soft-btn bg-gray-100 py-2 text-sm" type="button">Hủy</button></div></form></div>
      </div>
      <div class="glass-card p-4"><div class="flex flex-wrap gap-3 mb-3"><div class="flex-1"><textarea id="importText" class="w-full px-3 py-2 text-sm h-24" placeholder="word | meaning | type | ipa | ex1 | ex2 | syn | ant | cefr"></textarea></div><div><button id="importBtn" class="soft-btn bg-[#4a9eff] text-white px-4 py-2 text-sm w-full">Import</button><button id="exportBtn" class="soft-btn bg-gray-800 text-white px-4 py-2 text-sm w-full mt-2">Xuất</button></div></div><div class="flex gap-3 mb-3"><h2 class="text-xl font-bold">📖 Danh sách từ</h2><input id="searchInput" class="flex-1 px-3 py-2 text-sm" placeholder="Tìm kiếm..." /></div><div id="wordList" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-96 overflow-y-auto"></div></div>
    </section>
  </main>
</div>

<script>
const STORAGE_KEY='vocab_app_data',DAY_MS=86400000;
const todayKey=()=>new Date().toISOString().slice(0,10);
const startOfToday=()=>new Date().setHours(0,0,0,0);
const playSoundEffect=(freq,type,duration,volume=0.15)=>{try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();const g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration);setTimeout(()=>ac.close(),duration*1000);}catch(e){}}
const playBell=()=>{try{const ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();const g=ac.createGain();o.type='sine';o.frequency.value=880;g.gain.value=0.3;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>{o.frequency.value=660;setTimeout(()=>{o.frequency.value=440;setTimeout(()=>{o.stop();ac.close();},300);},300);},300);}catch(e){}}
const playCorrectSound=()=>playSoundEffect(880,'sine',0.25,0.2);
const playWrongSound=()=>playSoundEffect(220,'square',0.3,0.2);
const playPomoStart=()=>playSoundEffect(660,'sine',0.2,0.15);
const defaultData=()=>{const topicId=String(Date.now());const words=[['apple','quả táo','noun','/ˈæp.əl/','I eat an apple every day.','Apple is my favorite fruit.','fruit','','A1'],['curious','tò mò','adjective','/ˈkjʊr.i.əs/','Children are curious about the world.','She gave me a curious look.','inquisitive','indifferent','B1'],['improve','cải thiện','verb','/ɪmˈpruːv/','Practice will improve your English.','The weather improved today.','enhance','worsen','A2'],['important','quan trọng','adjective','/ɪmˈpɔːr.tənt/','Sleep is important for health.','This is an important lesson.','essential','minor','A2'],['journey','hành trình','noun','/ˈdʒɝː.ni/','The journey took three hours.','Learning is a lifelong journey.','trip','','B1'],['brave','dũng cảm','adjective','/breɪv/','The brave firefighter saved the child.','Be brave and try again.','courageous','cowardly','A2'],['discover','khám phá','verb','/dɪˈskʌv.ɚ/','Scientists discover new facts every day.','We discovered a small cafe.','find','lose','B1'],['garden','khu vườn','noun','/ˈɡɑːr.dən/','My grandmother grows roses in her garden.','The garden is quiet in the morning.','yard','','A1']].map((row,index)=>createWordFromParts(row,topicId,Date.now()+index));return{topics:[{id:topicId,name:'Demo Essentials',createdAt:Date.now()}],words,learningStats:{dailyProgress:{},streak:0,lastStudyDate:'',dailyGoal:20}}};
function createWordFromParts(parts,topicId,seed=Date.now()){const[en='',vi='',loai='',am='',ex1='',ex2='',syn='',ant='',cefr='B1']=parts.map(p=>(p||'').trim());return{id:String(seed)+Math.random().toString(16).slice(2),topicId,en,vi,loai,am,ex1,ex2,syn,ant,cefr:cefr||'B1',repetitions:0,easeFactor:2.5,interval:1,nextReviewDate:0,learningStep:undefined}}
let appData=loadData(),currentTab='study',currentMode='flashcard',currentCard=null,currentPool=[],currentIndex=0,selectedTopicId=appData.topics[0]?.id||'',selectedMatch=null,sessionCorrectStreak=0,sessionDone=0,speedRAF=null,speedEndTime=0,currentBlank=null,currentSentence='';
const $=id=>document.getElementById(id);const els={};
document.addEventListener('DOMContentLoaded',()=>{cacheElements();bindEvents();renderAll();initPomodoro();lucide.createIcons();renderMode(currentMode);});
function cacheElements(){['studyTabBtn','libraryTabBtn','studyTab','libraryTab','studyTopicSelect','modeSelect','practiceArea','feedbackBox','dueCount','streakCount','dailyDone','dailyProgressBar','sessionStreak','sessionDone','speakCurrentBtn','newTopicInput','addTopicBtn','topicGrid','wordForm','editingWordId','enInput','viInput','loaiInput','amInput','ex1Input','ex2Input','synInput','antInput','cefrInput','cancelEditBtn','importText','importBtn','exportBtn','searchInput','wordList','formTopicSelect','dailyGoal'].forEach(id=>els[id]=$(id));}
function loadData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return defaultData();const parsed=JSON.parse(raw);if(!parsed.topics||!parsed.words||!parsed.learningStats)return defaultData();parsed.learningStats.dailyProgress=parsed.learningStats.dailyProgress||{};parsed.learningStats.dailyGoal=parsed.learningStats.dailyGoal||20;parsed.words.forEach(c=>{if(c.learningStep===undefined)c.learningStep=3;});return parsed;}catch(e){return defaultData();}}
function saveData(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(appData));}catch(e){notify('Không thể lưu dữ liệu.','wrong');}}
function bindEvents(){els.studyTabBtn.onclick=()=>switchTab('study');els.libraryTabBtn.onclick=()=>switchTab('library');els.studyTopicSelect.onchange=e=>{selectedTopicId=e.target.value;renderMode(currentMode);renderStats();};els.modeSelect.onchange=e=>{currentMode=e.target.value;renderMode(currentMode);};els.formTopicSelect.onchange=e=>{selectedTopicId=e.target.value;els.studyTopicSelect.value=selectedTopicId;renderWordList();};els.speakCurrentBtn.onclick=()=>currentCard&&speak(currentCard.en);els.addTopicBtn.onclick=addTopic;els.wordForm.onsubmit=saveWordFromForm;els.cancelEditBtn.onclick=clearWordForm;els.importBtn.onclick=importWords;els.exportBtn.onclick=exportWords;els.searchInput.oninput=renderWordList;document.getElementById('dailyGoalInput')?.addEventListener('change',function(){appData.learningStats.dailyGoal=Math.max(1,Number(this.value)||20);saveData();renderStats();});}
function renderAll(){renderSelectors();renderTopics();renderWordList();renderStats();lucide.createIcons();}
function switchTab(tab){currentTab=tab;els.studyTab.classList.toggle('hidden',tab!=='study');els.libraryTab.classList.toggle('hidden',tab!=='library');els.studyTabBtn.classList.toggle('active',tab==='study');els.libraryTabBtn.classList.toggle('active',tab==='library');}
function renderSelectors(){const options=appData.topics.map(t=>`<option value="${t.id}">${escapeHTML(t.name)}</option>`).join('');els.studyTopicSelect.innerHTML=options;els.formTopicSelect.innerHTML=options;if(!selectedTopicId&&appData.topics[0])selectedTopicId=appData.topics[0].id;els.studyTopicSelect.value=selectedTopicId;els.formTopicSelect.value=selectedTopicId;}
function getTopicWords(t=selectedTopicId){return appData.words.filter(w=>w.topicId===t);}
function getDueCards(){const now=Date.now();return getTopicWords().filter(w=>(w.nextReviewDate||0)<=now).sort((a,b)=>(a.nextReviewDate||0)-(b.nextReviewDate||0));}
function renderMode(mode){currentMode=mode;els.modeSelect.value=mode;if(speedRAF)cancelAnimationFrame(speedRAF);const words=mode==='flashcard'?getDueCards():shuffle(getTopicWords());currentPool=words;currentIndex=0;if(!selectedTopicId||getTopicWords().length===0){els.practiceArea.innerHTML=emptyState('Hãy tạo bài học và thêm từ ở tab Thư viện trước nhé.');return;}if(mode==='flashcard'&&words.length===0){els.practiceArea.innerHTML=emptyState('Tuyệt vời! Hôm nay chưa có thẻ SRS nào đến hạn ôn.');return;}({flashcard:renderFlashcard,match:renderMatch,mcq:renderMCQ,writing:renderWriting,speed:renderSpeed,listenSentence:renderListenSentence,fillBlank:renderFillBlank,listenWord:renderListenWord}[mode])();renderStats();}
function nextCard(){if(!currentPool.length)return renderMode(currentMode);currentIndex=(currentIndex+1)%currentPool.length;({flashcard:renderFlashcard,mcq:renderMCQ,writing:renderWriting,speed:renderSpeed,listenSentence:renderListenSentence,fillBlank:renderFillBlank,listenWord:renderListenWord}[currentMode]||renderFlashcard)();}
function renderFlashcard(){currentCard=currentPool[currentIndex];els.practiceArea.innerHTML=`<div class="flex items-center justify-between mb-3"><h2 class="text-xl font-bold">Flashcard SRS</h2><span class="badge bg-blue-50">${currentIndex+1}/${currentPool.length}</span></div><div class="flash-scene"><div id="flashCard" class="flash-card"><div class="flash-face flash-front"><div class="flex gap-2 mb-3"><span class="badge bg-emerald-50">${escapeHTML(currentCard.loai||'word')}</span><span class="badge bg-blue-50">${escapeHTML(currentCard.cefr||'B1')}</span></div><h3 class="text-3xl md:text-4xl font-bold text-gray-800 text-center">${escapeHTML(currentCard.en)}</h3><p class="italic text-gray-400 mt-2 text-lg">${escapeHTML(currentCard.am||'')}</p><p class="mt-4 text-gray-400 text-sm">Nhấn vào thẻ để lật</p></div><div class="flash-face flash-back"><h3 class="text-2xl font-bold text-emerald-600 text-center">${escapeHTML(currentCard.vi)}</h3>${currentCard.ex1?`<div class="example-item mt-3"><span class="example-bullet">•</span><p class="text-xs text-gray-600">${escapeHTML(currentCard.ex1)}</p></div>`:''}${currentCard.ex2?`<div class="example-item"><span class="example-bullet">•</span><p class="text-xs text-gray-600">${escapeHTML(currentCard.ex2)}</p></div>`:''}<div class="flex flex-wrap gap-2 mt-3 justify-center">${currentCard.syn?`<span class="badge bg-green-50">Syn: ${escapeHTML(currentCard.syn)}</span>`:''}${currentCard.ant?`<span class="badge bg-red-50">Ant: ${escapeHTML(currentCard.ant)}</span>`:''}</div></div></div></div><div class="grid grid-cols-4 gap-2 mt-4"><button data-q="1" class="srs soft-btn bg-red-200 text-red-700 srs-btn">Again<br><span class="text-[9px]"></span></button><button data-q="2" class="srs soft-btn bg-amber-200 text-amber-700 srs-btn">Hard<br><span class="text-[9px]"></span></button><button data-q="3" class="srs soft-btn bg-emerald-200 text-emerald-700 srs-btn">Good<br><span class="text-[9px]"</span></button><button data-q="4" class="srs soft-btn bg-blue-200 text-blue-700 srs-btn">Easy<br><span class="text-[9px]"</span></button></div>`;$('flashCard').onclick=()=>$('flashCard').classList.toggle('is-flipped');els.practiceArea.querySelectorAll('.srs').forEach(btn=>btn.onclick=()=>handleSRS(Number(btn.dataset.q)));setTimeout(()=>speak(currentCard.en),120);}
function updateSM2_Anki(c,q){if(!c.learningStep)c.learningStep=0;if(!c.easeFactor)c.easeFactor=2.5;const now=Date.now();let d=0;if(q===1){c.learningStep=0;d=1;c.easeFactor=Math.max(1.3,c.easeFactor*0.8);notify(`🔄 Again: ôn sau 1 phút`,'wrong');}else if(q===2){d=6;c.easeFactor=Math.max(1.3,c.easeFactor-0.15);notify(`⏰ Hard: ôn sau 6 phút`,'wrong');}else if(q===3){if(c.learningStep<2){c.learningStep++;d=c.learningStep===1?6:10;notify(`✅ Good: ôn sau ${d} phút`,'correct');}else if(c.learningStep===2){c.learningStep=3;c.repetitions=(c.repetitions||0)+1;d=5*24*60;notify(`🎓 Good: tốt nghiệp! Ôn sau 5 ngày`,'correct');}else{c.repetitions++;let iDays=c.interval||5;if(c.repetitions===1)iDays=5;else if(c.repetitions===2)iDays=8;else iDays=Math.ceil(iDays*c.easeFactor);d=iDays*24*60;c.interval=iDays;c.easeFactor=Math.min(9.9,c.easeFactor+0.1);notify(`📚 Good: ôn sau ${iDays} ngày`,'correct');}}else if(q===4){c.learningStep=3;c.repetitions=(c.repetitions||0)+1;d=5*24*60;c.interval=5;c.easeFactor=Math.min(9.9,c.easeFactor+0.15);notify(`⚡ Easy: ôn sau 5 ngày`,'correct');}c.nextReviewDate=now+(d*60*1000);saveData();}
function handleSRS(q){updateSM2_Anki(currentCard,q);recordStudy(1);if(q>=3){sessionCorrectStreak++;sessionDone++;playCorrectSound();if(sessionCorrectStreak>=5)fireConfetti();}else{sessionCorrectStreak=0;playWrongSound();}renderStats();currentPool=getDueCards();if(!currentPool.length)return setTimeout(()=>renderMode('flashcard'),450);currentIndex=Math.min(currentIndex,currentPool.length-1);const c=$('flashCard');if(c)c.classList.remove('is-flipped');setTimeout(renderFlashcard,100);}
function renderMatch(){const pairs=shuffle(getTopicWords()).slice(0,12);const cards=shuffle(pairs.flatMap(w=>[{id:w.id,type:'en',text:w.en},{id:w.id,type:'vi',text:w.vi}]));els.practiceArea.innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Ghép thẻ</h2><button id="newMatch" class="soft-btn bg-blue-100 text-blue-700 px-3 py-1 text-sm">Ván mới</button></div><div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">${cards.map((c,i)=>`<button class="match-card text-sm" data-id="${c.id}" data-type="${c.type}" data-index="${i}">${escapeHTML(c.text)}</button>`).join('')}</div>`;$('newMatch').onclick=renderMatch;selectedMatch=null;els.practiceArea.querySelectorAll('.match-card').forEach(btn=>btn.onclick=()=>handleMatch(btn));}
function handleMatch(btn){if(btn.dataset.type==='en')speak(btn.textContent);if(!selectedMatch){selectedMatch=btn;btn.classList.add('selected');return;}if(selectedMatch===btn)return;const ok=selectedMatch.dataset.id===btn.dataset.id&&selectedMatch.dataset.type!==btn.dataset.type;if(ok){selectedMatch.classList.add('matched');btn.classList.add('matched');markCorrect('Ghép đúng!');recordStudy(1);}else{markWrong('Chưa đúng!');btn.classList.add('shake');setTimeout(()=>btn.classList.remove('shake'),300);}selectedMatch.classList.remove('selected');selectedMatch=null;}
function renderMCQ(){currentCard=currentPool[currentIndex];const choices=buildChoices(currentCard,'vi');els.practiceArea.innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Trắc nghiệm</h2><span class="badge bg-blue-50">${currentIndex+1}/${currentPool.length}</span></div><h3 class="text-2xl font-bold text-center my-5">${escapeHTML(currentCard.en)}</h3><div class="grid grid-cols-1 gap-2">${choices.map(c=>`<button class="answer-card soft-btn bg-white border p-3 text-sm" data-answer="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('')}</div>`;els.practiceArea.querySelectorAll('.answer-card').forEach(btn=>btn.onclick=()=>judgeButton(btn,btn.dataset.answer===currentCard.vi,currentCard.vi,()=>setTimeout(nextCard,500)));speak(currentCard.en);}
function renderWriting(){currentCard=currentPool[currentIndex];els.practiceArea.innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Tự viết</h2><span class="badge bg-blue-50">${currentIndex+1}/${currentPool.length}</span></div><p class="text-center text-gray-500 text-sm">Viết tiếng Anh</p><h3 class="text-2xl font-bold text-center my-5 text-emerald-600">${escapeHTML(currentCard.vi)}</h3><input id="writingInput" class="w-full p-3 text-center text-lg rounded-xl border" placeholder="Gõ English word..."><button id="writingCheck" class="soft-btn mt-3 w-full bg-[#4a9eff] text-white py-2">Kiểm tra</button>`;$('writingCheck').onclick=()=>checkText($('writingInput').value,currentCard.en,()=>setTimeout(nextCard,600));$('writingInput').onkeydown=e=>{if(e.key==='Enter')$('writingCheck').click();};$('writingInput').focus();}
function renderSpeed(){currentCard=currentPool[currentIndex];const choices=buildChoices(currentCard,'en');els.practiceArea.innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Phản xạ nhanh</h2><span class="badge bg-blue-50">${currentIndex+1}/${currentPool.length}</span></div><div class="h-2 bg-red-100 rounded-full mb-3"><div id="speedBar" class="progress-red h-full bg-red-500 rounded-full" style="width:100%"></div></div><p class="text-center text-sm">Chọn đáp án trong 5 giây</p><h3 class="text-2xl font-bold text-center my-5 text-emerald-600">${escapeHTML(currentCard.vi)}</h3><div class="grid grid-cols-2 gap-2">${choices.map(c=>`<button class="answer-card soft-btn bg-white border p-3 text-sm" data-answer="${escapeHTML(c)}">${escapeHTML(c)}</button>`).join('')}</div>`;els.practiceArea.querySelectorAll('.answer-card').forEach(btn=>btn.onclick=()=>{if(speedRAF)cancelAnimationFrame(speedRAF);judgeButton(btn,btn.dataset.answer===currentCard.en,currentCard.en,()=>setTimeout(nextCard,600));});speedEndTime=performance.now()+5000;tickSpeedTimer();}
function tickSpeedTimer(){const left=Math.max(0,speedEndTime-performance.now());const bar=$('speedBar');if(bar)bar.style.width=`${(left/5000)*100}%`;if(left<=0){markWrong(`Hết giờ! Đáp án: ${currentCard.en}`);setTimeout(nextCard,800);return;}speedRAF=requestAnimationFrame(tickSpeedTimer);}
function renderListenSentence(){currentCard=currentPool[currentIndex];currentSentence=shuffle([currentCard.ex1,currentCard.ex2].filter(Boolean))[0]||currentCard.en;els.practiceArea.innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Nghe chép câu</h2><span class="badge bg-blue-50">${currentIndex+1}/${currentPool.length}</span></div><div class="flex justify-center mb-3"><button id="listenAgain" class="soft-btn bg-blue-100 text-blue-700 px-4 py-1 text-sm">🔊 Nghe lại</button></div><textarea id="sentenceInput" class="w-full p-3 rounded-xl border h-24" placeholder="Gõ câu bạn nghe..."></textarea><button id="sentenceCheck" class="soft-btn mt-3 w-full bg-[#4a9eff] text-white py-2">Kiểm tra</button>`;$('listenAgain').onclick=()=>speak(currentSentence);$('sentenceCheck').onclick=()=>checkText(normalizeSentence($('sentenceInput').value),normalizeSentence(currentSentence),()=>setTimeout(nextCard,700),currentSentence);setTimeout(()=>speak(currentSentence),200);}
function renderFillBlank(){currentCard=currentPool[currentIndex];currentBlank=makeBlank(currentCard.en);els.practiceArea.innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Điền khuyết</h2><span class="badge bg-blue-50">${currentIndex+1}/${currentPool.length}</span></div><p class="text-center text-sm">Điền phần còn thiếu</p><h3 class="text-3xl font-bold text-center my-5 font-mono">${escapeHTML(currentBlank.masked)}</h3><input id="blankInput" class="w-full p-3 text-center text-lg rounded-xl border" placeholder="Nhập phần thiếu..."><button id="blankCheck" class="soft-btn mt-3 w-full bg-[#4a9eff] text-white py-2">Kiểm tra</button>`;$('blankCheck').onclick=()=>checkText($('blankInput').value,currentBlank.missing,()=>setTimeout(nextCard,600));$('blankInput').focus();}
function renderListenWord(){currentCard=currentPool[currentIndex];els.practiceArea.innerHTML=`<div class="flex justify-between mb-3"><h2 class="text-xl font-bold">Nghe chép từ</h2><span class="badge bg-blue-50">${currentIndex+1}/${currentPool.length}</span></div><div class="flex justify-center mb-3"><button id="wordListenAgain" class="soft-btn bg-blue-100 text-blue-700 px-4 py-1 text-sm">🔊 Nghe lại</button></div><input id="listenWordInput" class="w-full p-3 text-center text-lg rounded-xl border" placeholder="Gõ từ tiếng Anh..."><button id="listenWordCheck" class="soft-btn mt-3 w-full bg-[#4a9eff] text-white py-2">Kiểm tra</button>`;$('wordListenAgain').onclick=()=>speak(currentCard.en);$('listenWordCheck').onclick=()=>checkText($('listenWordInput').value,currentCard.en,()=>setTimeout(nextCard,600));setTimeout(()=>speak(currentCard.en),200);}
function buildChoices(card,field){const others=shuffle(getTopicWords().filter(w=>w.id!==card.id)).slice(0,3).map(w=>w[field]);while(others.length<3)others.push(field==='vi'?'Đáp án nhiễu':'distractor');return shuffle([card[field],...others]);}
function judgeButton(btn,isCorrect,correctAnswer,onCorrect){btn.classList.add(isCorrect?'correct':'wrong');if(isCorrect){markCorrect('Đúng rồi!');recordStudy(1);onCorrect?.();}else{markWrong(`Sai! Đáp án: ${correctAnswer}`);revealCorrect(correctAnswer);setTimeout(nextCard,900);}}
function checkText(v,a,onCorrect,d=a){const ok=String(v).trim().toLowerCase()===String(a).trim().toLowerCase();if(ok){markCorrect('Đúng rồi!');recordStudy(1);onCorrect?.();}else{markWrong(`Sai! Đáp án: ${d}`);els.practiceArea.classList.add('shake');setTimeout(()=>els.practiceArea.classList.remove('shake'),300);}}
function revealCorrect(correctAnswer){els.practiceArea.querySelectorAll('.answer-card').forEach(b=>{if(b.dataset.answer===correctAnswer)b.classList.add('correct');});}
function markCorrect(m){sessionCorrectStreak++;sessionDone++;playCorrectSound();notify(`✅ ${m}`,'correct');if(sessionCorrectStreak>=5){fireConfetti();sessionCorrectStreak=0;}renderStats();}
function markWrong(m){sessionCorrectStreak=0;playWrongSound();notify(`❌ ${m}`,'wrong');els.practiceArea.classList.add('shake');setTimeout(()=>els.practiceArea.classList.remove('shake'),300);renderStats();}
function notify(m,t='info'){els.feedbackBox.textContent=m;els.feedbackBox.className=`rounded-xl border p-2 text-xs font-bold ${t==='correct'?'bg-emerald-50 text-emerald-700 border-emerald-200':t==='wrong'?'bg-red-50 text-red-700 border-red-200':'bg-gray-50 text-gray-600'}`;}
function speak(text){if(!text||!('speechSynthesis'in window)){notify('Trình duyệt không hỗ trợ đọc.','wrong');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.9;window.speechSynthesis.speak(u);}
function fireConfetti(){if(typeof confetti==='function')confetti({particleCount:120,spread:70,origin:{y:0.65}});}
function recordStudy(c){const key=todayKey();const s=appData.learningStats;s.dailyProgress[key]=(s.dailyProgress[key]||0)+c;if(s.lastStudyDate!==key){const yesterday=new Date(Date.now()-DAY_MS).toISOString().slice(0,10);s.streak=s.lastStudyDate===yesterday?(s.streak||0)+1:1;s.lastStudyDate=key;}saveData();}
function renderStats(){const done=appData.learningStats.dailyProgress[todayKey()]||0;const goal=appData.learningStats.dailyGoal||20;els.streakCount.textContent=appData.learningStats.streak||0;els.dailyDone.textContent=done;if(els.dailyGoal)els.dailyGoal.textContent=goal;const goalInput=document.getElementById('dailyGoalInput');if(goalInput)goalInput.value=goal;els.dailyProgressBar.style.width=`${Math.min(100,Math.round(done/goal*100))}%`;els.sessionStreak.textContent=sessionCorrectStreak;els.sessionDone.textContent=sessionDone;els.dueCount.textContent=getDueCards().length;}
function addTopic(){const name=els.newTopicInput.value.trim();if(!name)return notify('Nhập tên bài học!','wrong');const topic={id:String(Date.now()),name,createdAt:Date.now()};appData.topics.push(topic);selectedTopicId=topic.id;els.newTopicInput.value='';saveData();renderAll();renderMode(currentMode);notify('Đã tạo bài học mới.','correct');}
function deleteTopic(id){if(!confirm('Xóa bài học này và toàn bộ từ bên trong?'))return;appData.topics=appData.topics.filter(t=>t.id!==id);appData.words=appData.words.filter(w=>w.topicId!==id);if(!appData.topics.length)appData.topics.push({id:String(Date.now()),name:'Bài học mới',createdAt:Date.now()});selectedTopicId=appData.topics[0].id;saveData();renderAll();renderMode(currentMode);}
function renderTopics(){els.topicGrid.innerHTML=appData.topics.map(t=>`<div class="rounded-xl border bg-white p-2"><div class="flex justify-between items-center"><div><h3 class="font-bold text-sm">${escapeHTML(t.name)}</h3><p class="text-[10px] text-gray-500">${appData.words.filter(w=>w.topicId===t.id).length} từ</p></div><div class="flex gap-1"><button class="view-topic-words text-blue-500 text-xs px-2 py-1" data-id="${t.id}" data-name="${escapeHTML(t.name)}">📖 Xem</button><button class="delete-topic text-red-500" data-id="${t.id}">🗑️</button></div></div></div>`).join('');els.topicGrid.querySelectorAll('.delete-topic').forEach(btn=>btn.onclick=()=>deleteTopic(btn.dataset.id));els.topicGrid.querySelectorAll('.view-topic-words').forEach(btn=>btn.onclick=()=>showTopicWords(btn.dataset.id,btn.dataset.name));lucide.createIcons();}
function showTopicWords(topicId,topicName){const words=appData.words.filter(w=>w.topicId===topicId);if(words.length===0){alert(`Bài "${topicName}" chưa có từ nào.`);return;}let msg=`📖 TỪ VỰNG - ${topicName}\n━━━━━━━━━━━━━━━━━━━━\n`;words.forEach((w,i)=>{msg+=`\n${i+1}. ${w.en} - ${w.vi}\n   📌 ${w.loai||'word'} | ${w.cefr||'B1'}\n   📝 ${w.ex1||'---'}\n`;});alert(msg);}
function saveWordFromForm(e){e.preventDefault();const id=els.editingWordId.value;const word=readFormWord();if(!word.en||!word.vi)return notify('English và nghĩa là bắt buộc.','wrong');const duplicate=appData.words.find(w=>w.topicId===word.topicId&&w.en.toLowerCase()===word.en.toLowerCase()&&w.id!==id);if(duplicate)return notify('Từ đã tồn tại!','wrong');if(id){Object.assign(appData.words.find(w=>w.id===id),word);}else{appData.words.push({...word,id:String(Date.now()),repetitions:0,easeFactor:2.5,interval:5,nextReviewDate:0,learningStep:undefined});}saveData();clearWordForm();renderAll();renderMode(currentMode);notify('Đã lưu từ vựng.','correct');}
function readFormWord(){return{topicId:els.formTopicSelect.value,en:els.enInput.value.trim(),vi:els.viInput.value.trim(),loai:els.loaiInput.value.trim(),am:els.amInput.value.trim(),ex1:els.ex1Input.value.trim(),ex2:els.ex2Input.value.trim(),syn:els.synInput.value.trim(),ant:els.antInput.value.trim(),cefr:els.cefrInput.value.trim()||'B1'};}
function editWord(id){const w=appData.words.find(i=>i.id===id);if(!w)return;els.editingWordId.value=w.id;els.formTopicSelect.value=w.topicId;['en','vi','loai','am','ex1','ex2','syn','ant','cefr'].forEach(k=>els[`${k}Input`].value=w[k]||'');switchTab('library');window.scrollTo({top:0,behavior:'smooth'});}
function clearWordForm(){els.wordForm.reset();els.editingWordId.value='';els.cefrInput.value='';if(selectedTopicId)els.formTopicSelect.value=selectedTopicId;}
function deleteWord(id){if(!confirm('Xóa từ này?'))return;appData.words=appData.words.filter(w=>w.id!==id);saveData();renderAll();renderMode(currentMode);}
function renderWordList(){const q=(els.searchInput?.value||'').trim().toLowerCase();const words=appData.words.filter(w=>!q||w.en.toLowerCase().includes(q)||w.vi.toLowerCase().includes(q));els.wordList.innerHTML=words.map(w=>`<div class="rounded-xl border bg-white p-2"><div class="flex justify-between items-start"><div><h3 class="font-bold text-sm">${escapeHTML(w.en)} <span class="text-gray-400 text-[10px]">${escapeHTML(w.am||'')}</span></h3><p class="text-emerald-600 font-bold text-xs">${escapeHTML(w.vi)}</p><p class="text-[9px] text-gray-500">${escapeHTML(w.loai||'')} · ${escapeHTML(w.cefr||'B1')}</p>${w.ex1?`<p class="text-[10px] text-gray-400 mt-1">• ${escapeHTML(w.ex1)}</p>`:''}</div><div class="flex gap-1"><button class="edit-word text-blue-500" data-id="${w.id}">✏️</button><button class="delete-word text-red-500" data-id="${w.id}">🗑️</button></div></div></div>`).join('')||emptyState('Không tìm thấy từ.');els.wordList.querySelectorAll('.edit-word').forEach(btn=>btn.onclick=()=>editWord(btn.dataset.id));els.wordList.querySelectorAll('.delete-word').forEach(btn=>btn.onclick=()=>deleteWord(btn.dataset.id));lucide.createIcons();}
function importWords(){const lines=els.importText.value.split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return notify('Dán dữ liệu import trước.','wrong');let added=0,skipped=0;lines.forEach(line=>{const parts=line.split('|').map(p=>p.trim());const word=createWordFromParts(parts,selectedTopicId);if(!word.en||!word.vi||appData.words.some(w=>w.topicId===selectedTopicId&&w.en.toLowerCase()===word.en.toLowerCase())){skipped++;return;}appData.words.push(word);added++;});els.importText.value='';saveData();renderAll();renderMode(currentMode);notify(`Import ${added} từ, bỏ qua ${skipped}`,'correct');}
function exportWords(){const text=appData.topics.map(t=>`=== BÀI: ${t.name} ===\n`+appData.words.filter(w=>w.topicId===t.id).map(w=>[w.en,w.vi,w.loai,w.am,w.ex1,w.ex2,w.syn,w.ant,w.cefr].join(' | ')).join('\n')).join('\n\n');const blob=new Blob([text],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mint-vocab-export.txt';a.click();URL.revokeObjectURL(a.href);}
function makeBlank(w){const c=String(w||'word');const len=Math.min(2,Math.max(1,Math.floor(c.length/4)));const start=Math.max(1,Math.floor(c.length/2)-1);return{masked:c.slice(0,start)+'___'+c.slice(start+len),missing:c.slice(start,start+len)};}
function normalizeSentence(t){return String(t).toLowerCase().replace(/[.,!?;:'"“”‘’()\-]/g,' ').replace(/\s+/g,' ').trim();}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function escapeHTML(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function emptyState(m){return`<div class="rounded-xl border border-dashed bg-gray-50 p-6 text-center text-gray-500 text-sm">${escapeHTML(m)}</div>`;}
function initPomodoro(){const t=$('pomodoroTime');let mode='focus',dur=25*60*1000,rem=dur,running=false,endAt=0,raf=null;function draw(){const total=Math.max(0,running?endAt-performance.now():rem);const m=Math.floor(total/60000).toString().padStart(2,'0');const s=Math.floor((total%60000)/1000).toString().padStart(2,'0');if(t)t.textContent=`${m}:${s}`;if(running&&total<=0)finish();else if(running)raf=requestAnimationFrame(draw);}function finish(){running=false;playBell();if(mode==='focus'){alert('🔔 HẾT GIỜ HỌC! Nghỉ 5 phút nhé!');mode='break';dur=5*60*1000;}else{alert('🔔 HẾT GIỜ NGHỈ! Học tiếp nào!');mode='focus';dur=25*60*1000;}rem=dur;draw();}const playBtn=$('pomodoroPlay'),pauseBtn=$('pomodoroPause'),resetBtn=$('pomodoroReset');if(playBtn)playBtn.onclick=()=>{if(running)return;running=true;playPomoStart();endAt=performance.now()+rem;draw();};if(pauseBtn)pauseBtn.onclick=()=>{if(!running)return;rem=Math.max(0,endAt-performance.now());running=false;if(raf)cancelAnimationFrame(raf);draw();};if(resetBtn)resetBtn.onclick=()=>{running=false;if(raf)cancelAnimationFrame(raf);mode='focus';dur=25*60*1000;rem=dur;draw();};draw();}
</script>
